kind = "web"
previewPath = "/"
title = "نواة الرقمية"
description = "موقع تعريفي عربي لاستوديو برمجة وتصميم يقدم تطوير المواقع والمتاجر الإلكترونية وتطبيقات الويب وتحسين محركات البحث والهوية البصرية والاستضافة والصيانة."
version = "1.0.0"
id = "artifacts/digital-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20990

[services.development]
run = "pnpm --filter @workspace/digital-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/digital-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20990"
BASE_PATH = "/"
